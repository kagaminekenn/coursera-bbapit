apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
name: cleanup
spec:
description: Clears all existing files in the shared workspace to ensure a clean build environment.
workspaces:
- name: source
steps:
- name: clean-workspace
image: alpine:latest
workingDir: $(workspaces.source.path)
script: |
#!/bin/sh
echo "Removing previous workspace contents..."
rm -rf *
echo "Workspace cleanup completed."

apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
name: nose
spec:
description: Runs automated unit tests using the nose test runner in Python.
workspaces:
- name: source
params:
- name: args
description: The arguments to pass to nose
type: string
default: "-v"
steps:
- name: run-tests
image: python:3.9-slim
workingDir: $(workspaces.source.path)
script: |
#!/bin/bash
set -e
echo "Installing test dependencies..."
pip install --upgrade pip
if [ -f requirements.txt ]; then
pip install -r requirements.txt
fi
pip install nose

    echo "Running nose unit tests..."
    nosetests $(params.args)
